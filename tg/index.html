<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ECL &amp; ALCPT Trainer</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="../favicon.ico" sizes="any">
<!-- Telegram mini app of the trainer: a light version with 50 questions per
     training. The website (/, /practice/) does not use any file of this
     folder. Questions: data.js, generated by tools/tg-miniapp/build.py. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Monetag SDK for Telegram Mini App -->
<script src='//libtl.com/sdk.js' data-zone='12140681' data-sdk='show_12140681'></script>
<!-- Reuse the website's existing GA4 configuration for visitor analytics -->
<script src="../assets/config.js"></script>
<script src="../assets/analytics.js"></script>
<style>
:root {
  --fb-bg: #EFEFF4; --fb-card: #FFFFFF; --fb-text: #0F1419; --fb-hint: #8A8F98;
  --fb-btn: #2A6FDB; --fb-btn-text: #FFFFFF; --fb-sep: rgba(60, 60, 67, .14); --fb-danger: #E5393B;
  --bg: var(--tg-theme-secondary-bg-color, var(--fb-bg));
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--fb-card)));
  --text: var(--tg-theme-text-color, var(--fb-text));
  --hint: var(--tg-theme-hint-color, var(--fb-hint));
  --sub: var(--tg-theme-subtitle-text-color, var(--hint));
  --head: var(--tg-theme-section-header-text-color, var(--hint));
  --btn: var(--tg-theme-button-color, var(--fb-btn));
  --btn-text: var(--tg-theme-button-text-color, var(--fb-btn-text));
  --accent: var(--tg-theme-accent-text-color, var(--btn));
  --link: var(--tg-theme-link-color, var(--btn));
  --danger: var(--tg-theme-destructive-text-color, var(--fb-danger));
  --sep: var(--tg-theme-section-separator-color, var(--fb-sep));
  --ok: #2EA44F; --ok-bg: rgba(46, 164, 79, .13); --bad-bg: rgba(229, 57, 59, .12);
  --r: 14px;
  --top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  --bottom: calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px));
}
@media (prefers-color-scheme: dark) {
  :root { --fb-bg: #0F0F10; --fb-card: #1C1C1E; --fb-text: #F2F2F5; --fb-hint: #8E8E93;
    --fb-btn: #3E88F7; --fb-sep: rgba(255, 255, 255, .1); --fb-danger: #FF5A5F; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: var(--tg-viewport-stable-height, 100vh);
  -webkit-text-size-adjust: 100%; overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
#app { max-width: 560px; margin: 0 auto; padding: calc(var(--top) + 12px) 14px calc(var(--bottom) + 24px); }
.hidden { display: none !important; }

/* ---------------- home ---------------- */
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 4px 14px; }
.brand img { width: 42px; height: 42px; border-radius: 11px; flex: none; }
.brand b { display: block; font-size: 17px; line-height: 1.2; }
.brand span { color: var(--hint); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.stat { background: var(--card); border-radius: var(--r); padding: 10px 8px; text-align: center; }
.stat b { display: block; font-size: 20px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat span { color: var(--hint); font-size: 12px; }
.h { color: var(--head); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; padding: 0 16px 6px; }
.group { background: var(--card); border-radius: var(--r); overflow: hidden; margin-bottom: 18px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px; text-align: left; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 62px; right: 0; border-top: .5px solid var(--sep); }
.row:active { background: var(--sep); }
.ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; color: #fff; }
.ico svg { width: 20px; height: 20px; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 500; font-size: 16px; }
.row .t span { display: block; color: var(--sub); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 3px; border-radius: 2px; background: var(--sep); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 2px; }
.chev { color: var(--hint); flex: none; width: 8px; height: 14px; }
.seg { display: flex; background: var(--card); border-radius: 10px; padding: 3px; margin: 0 0 18px; }
.seg button { flex: 1; padding: 7px 0; border-radius: 8px; font-size: 14px; color: var(--hint); }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-text); font-weight: 600; }
.seg-l { display: flex; justify-content: space-between; align-items: baseline; }
.promo { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: var(--r); padding: 12px 14px; margin-bottom: 18px; width: 100%; text-align: left; }
.promo img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
.promo .t { flex: 1; }
.promo b { display: block; font-weight: 600; }
.promo span { color: var(--sub); font-size: 13px; }
.promo em { font-style: normal; color: var(--link); font-weight: 600; font-size: 14px; flex: none; }
.foot { color: var(--hint); font-size: 12px; text-align: center; padding: 4px 12px; }
.foot button { color: var(--link); font-size: 12px; }

/* ---------------- quiz ---------------- */
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--hint); font-size: 13px; padding: 0 2px 8px; }
.qtop b { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qtop span { font-variant-numeric: tabular-nums; flex: none; }
.prog { height: 4px; border-radius: 2px; background: var(--sep); overflow: hidden; margin-bottom: 14px; }
.prog i { display: block; height: 100%; background: var(--btn); transition: width .25s; }
.card { background: var(--card); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
.tag { display: inline-block; color: var(--accent); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }
.q { font-size: 18px; line-height: 1.45; margin: 0; }
.q b { font-weight: 700; color: var(--accent); }
.opts { display: grid; gap: 8px; margin-bottom: 12px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 16px; min-height: 52px; border: 1.5px solid transparent; transition: background .15s, border-color .15s; }
.opt .k { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 700; color: var(--hint); border: 1.5px solid var(--sep); }
.opt:not([disabled]):active { background: var(--sep); }
.opt[disabled] { cursor: default; }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); }
.opt.ok .k { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.bad { background: var(--bad-bg); border-color: var(--danger); }
.opt.bad .k { background: var(--danger); border-color: var(--danger); color: #fff; }
.opt.dim { opacity: .55; }
.ex { font-size: 15px; }
.ex .v { font-weight: 600; margin-bottom: 4px; }
.ex .v.ok { color: var(--ok); }
.ex .v.bad { color: var(--danger); }
.ex p { margin: 6px 0 0; color: var(--text); }
.ex b { color: var(--accent); }
.script { margin-top: 10px; padding-top: 10px; border-top: .5px solid var(--sep); font-size: 14px; color: var(--sub); }
.script p { margin: 3px 0; }
.script i { font-style: normal; font-weight: 600; color: var(--hint); }
.play { display: flex; align-items: center; gap: 14px; }
.pbtn { width: 56px; height: 56px; border-radius: 50%; background: var(--btn); color: var(--btn-text); display: grid; place-items: center; flex: none; }
.pbtn svg { width: 24px; height: 24px; }
.pbtn.on { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.92); opacity: .85; } }
.play .t b { display: block; font-weight: 600; }
.play .t span { color: var(--sub); font-size: 13px; }
.big { display: block; width: 100%; background: var(--btn); color: var(--btn-text); border-radius: 12px; padding: 14px; font-weight: 600; font-size: 16px; text-align: center; margin-bottom: 10px; }
.big.alt { background: var(--card); color: var(--link); }
.tg .big.main { display: none; }

/* ---------------- result ---------------- */
.res { text-align: center; padding: 22px 16px; }
.ring { width: 120px; height: 120px; margin: 0 auto 10px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; font-variant-numeric: tabular-nums; }
.res h2 { margin: 4px 0 2px; font-size: 20px; }
.res p { margin: 0; color: var(--sub); }
.wrong .card { padding: 12px 14px; margin-bottom: 8px; font-size: 14px; }
.wrong .card p { margin: 0 0 4px; }
.wrong .card .c { color: var(--ok); font-weight: 600; }

/* ---------------- app popup (bottom sheet) ---------------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 10; opacity: 0; transition: opacity .2s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 18px 18px 0 0; padding: 22px 18px calc(var(--bottom) + 18px); text-align: center; transform: translateY(100%); transition: transform .25s ease-out; }
.sheet.open { transform: none; }
.sheet-bg.open { opacity: 1; }
.sheet img { width: 64px; height: 64px; border-radius: 15px; }
.sheet h2 { margin: 10px 0 6px; font-size: 20px; }
.sheet p { margin: 0 0 16px; color: var(--sub); font-size: 15px; }
.sheet .big { display: flex; align-items: center; justify-content: center; gap: 8px; }
.sheet .big svg { width: 20px; height: 20px; }
.sheet .later { color: var(--hint); padding: 8px 16px; font-size: 15px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="sheet-bg hidden" id="sheetBg"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetH">
  <img src="../assets/img/logo-192.png" alt="" width="64" height="64">
  <h2 id="sheetH">Keep practicing</h2>
  <p id="sheetP">The full trainer has 3,811 questions, 4,051 recorded listening questions and 80 timed ALCPT/ECL tests.</p>
  <button type="button" class="big" id="goPlay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.4"/><path d="M10.5 18.2h3"/></svg>Get the free Android app</button>
  <button type="button" class="big alt" id="goSite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5c-2.6-2.8-3.9-6-3.9-9.5s1.3-6.7 3.9-9.5z"/></svg>Open the website</button>
  <button type="button" class="later" id="sheetX">Not now</button>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<!-- Enable Monetag in-app interstitials conservatively: at most 2 per 24h, 3-minute interval, 30-second startup delay. -->
<script>
  (function () {
    try {
      if (typeof window.show_12140681 === 'function') {
        window.show_12140681({
          type: 'inApp',
          inAppSettings: { frequency: 2, capping: 24, interval: 180, timeout: 30, everyPage: false }
        }).catch(function () {});
      }
    } catch (e) {}
  })();
</script>
</body>
</html>
