# Read-aloud recordings (grammar, vocabulary, idioms..., lessons) with Kokoro
# TTS: free, open-source, run on GitHub's own machines (no API, no key, no
# billing). Runs when the questions, the lessons or the tools change, or by hand
# (Actions > Read-aloud audio > Run workflow). Only missing texts are recorded,
# in 8 parallel batches; the MP3 files are committed back.
name: Read-aloud audio

on:
  push:
    paths:
      - 'practice/data/**'
      - 'practice/js/app.js'
      - 'assets/listen-audio.js'
      - 'tools/read-audio/**'
      - '.github/workflows/read-audio.yml'
      - 'index.html'
      - 'lessons/**'
      - 'topics/**'
      - 'guides/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: read-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.count.outputs.missing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect the texts read aloud
        run: |
          npm install --no-save --no-package-lock --silent playwright-core@1.56.1
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node tools/read-audio/harvest.js
      - id: count
        run: |
          python3 tools/read-audio/generate.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo "missing=$(python3 tools/read-audio/generate.py --missing)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: texts
          path: tools/read-audio/texts.json

  generate:
    needs: harvest
    if: needs.harvest.outputs.missing != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kokoro (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro==0.9.4" soundfile
      - name: Cache the Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1
      - uses: actions/download-artifact@v4
        with:
          name: texts
          path: tools/read-audio
      - name: Record batch ${{ matrix.shard }} of 8
        run: python3 tools/read-audio/generate.py --all --shard ${{ matrix.shard }} --shards 8 --out new
      - uses: actions/upload-artifact@v4
        with:
          name: read-${{ matrix.shard }}
          path: new/*.mp3
          if-no-files-found: ignore
          retention-days: 3

  commit:
    needs: [harvest, generate]
    if: always() && needs.harvest.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: texts
          path: tools/read-audio
      - uses: actions/download-artifact@v4
        with:
          pattern: read-*
          path: assets/audio/read
          merge-multiple: true
      - name: Save to the repository
        run: |
          python3 tools/read-audio/generate.py --index | tee -a "$GITHUB_STEP_SUMMARY"
          git add -A assets/audio/read tools/read-audio/texts.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Read-aloud audio: Kokoro recordings (am_michael)"
          git pull --rebase -q
          git push
