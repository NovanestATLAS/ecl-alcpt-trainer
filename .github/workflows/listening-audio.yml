# Recordings of the listening questions with Kokoro TTS (free, open-source,
# run on GitHub's own machines: no paid API, no key, no billing).
# Runs when the listening questions or the generator change, or by hand
# (Actions > Listening audio > Run workflow). Only missing or changed lines
# are recorded, in 8 parallel batches; the MP3 files and the manifest are
# committed back. Man: am_michael (L01-L155), am_liam (L156 and after);
# woman: af_heart.
name: Listening audio

on:
  push:
    paths:
      - 'practice/js/listening-data.js'
      - 'tests/*listening*.html'
      - 'tests/*practice-test.html'
      - 'tests/ecl-practice-questions.html'
      - 'tools/listening-audio/**'
      - '.github/workflows/listening-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listening-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.count.outputs.missing }}
    steps:
      - uses: actions/checkout@v4
      - id: count
        run: |
          python3 tools/listening-audio/generate.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo "missing=$(python3 tools/listening-audio/generate.py --missing)" >> "$GITHUB_OUTPUT"

  generate:
    needs: count
    if: needs.count.outputs.missing != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kokoro (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro==0.9.4" soundfile
      - name: Cache the Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1
      - name: Record batch ${{ matrix.shard }} of 8
        run: python3 tools/listening-audio/generate.py --all --shard ${{ matrix.shard }} --shards 8 --out new
      - uses: actions/upload-artifact@v4
        with:
          name: listening-${{ matrix.shard }}
          path: new/
          if-no-files-found: ignore
          retention-days: 3

  commit:
    needs: [count, generate]
    if: always() && needs.count.result == 'success' && needs.count.outputs.missing != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: listening-*
          path: new
          merge-multiple: true
      - name: Save to the repository
        run: |
          mkdir -p new && cp new/*.mp3 assets/audio/listening/ 2>/dev/null || true
          python3 tools/listening-audio/generate.py --merge new | tee -a "$GITHUB_STEP_SUMMARY"
          git add -A assets/audio/listening
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Listening audio: Kokoro recordings (am_michael, am_liam / af_heart)"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i * 5)); done
          exit 1
