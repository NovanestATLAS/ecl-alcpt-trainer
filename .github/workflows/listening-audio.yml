# Recordings of the listening questions with Kokoro TTS (free, open-source,
# run on the GitHub runner itself: no paid API, no key, no billing).
# Runs when the listening questions or the generator change, or by hand
# (Actions > Listening audio > Run workflow). Only missing or changed lines
# are recorded; the new MP3 files and the manifest are committed back.
name: Listening audio

on:
  push:
    paths:
      - 'practice/js/listening-data.js'
      - 'tests/*listening*.html'
      - 'tests/*practice-test.html'
      - 'tests/ecl-practice-questions.html'
      - 'tools/listening-audio/**'
      - '.github/workflows/listening-audio.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Question ids to record (empty = every missing or changed line)'
        default: ''

permissions:
  contents: write

concurrency:
  group: listening-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Kokoro (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro==0.9.4" soundfile

      - name: Cache the Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Record the missing lines
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python3 tools/listening-audio/generate.py --only "${{ inputs.only }}"
          else
            python3 tools/listening-audio/generate.py --all --batch 20
          fi | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save to the repository
        run: |
          git add -A assets/audio/listening
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Listening audio: Kokoro recordings (am_michael / af_heart)"
          git pull --rebase -q
          git push
